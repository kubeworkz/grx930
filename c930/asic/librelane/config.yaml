  # DDR stub: the ASIC has no DDR PHY, only the register interface.
  - dir::../../synth/c930_ddr_stub.sv
# The SoC clock; the same period flow_openroad.tcl used (100 MHz).
CLOCK_PORT: i_clk
CLOCK_PERIOD: 10.0

VDD_NETS:
- VDD
GND_NETS:
- VSS

# This design has never been through a real SKY130 P&R run, so keep the router's
# default behaviour rather than tightening it on a guess.
GRT_ALLOW_CONGESTION: true

# ---------------------------------------------------------------------------
# Storage in foundry SRAM instead of flip-flops (`USE_SKY130_SRAM`)
# ---------------------------------------------------------------------------
# Yosys never finished this design with the storage as flop arrays: the L2's 16
# data planes alone are 524,288 flops
# (NUM_WAYS x WORDS_PER_LINE banks of NUM_SETS x DATA_WIDTH) and the run was
# killed twice at 20.4 GB of RAM after 33 and 20 minutes inside elaboration,
# with the log's last line a `Replacing memory \valid_mem with list of registers`.
# The arrays are now built from the PDK's own SRAM macros -- two
# sky130_sram_2kbyte_1rw1r_32x512_8 per L2 data plane (512 x 32, one read-write
# and one independent read port, registered outputs: the bank's exact read/write
# cycle shape) and eight sky130_sram_1kbyte_1rw1r_32x256_8 per 256-bit cache line
# in the L1 I and D caches.
#
# The define is flow-scoped: `make sim` and the FPGA build never set it, so they
# keep the flop arrays, and they are what the RTL is simulated against.
VERILOG_DEFINES:
  - USE_SKY130_SRAM

# Declared so Yosys reads each macro's Verilog model with `read_verilog -lib`
# (blackbox: ports only, no logic) instead of trying to synthesize the OpenRAM
# model's `initial`-loaded array. Paths come from the PDK tree, so nothing is
# vendored here.
#
# No `instances` block: placement is not configured yet, so this run stops at
# synthesis. Any P&R attempt needs a die size and a location for each of the 48
# macro instances before it can floorplan.
MACROS:
  sky130_sram_2kbyte_1rw1r_32x512_8:
    gds:
      - pdk_dir::libs.ref/sky130_sram_macros/gds/sky130_sram_2kbyte_1rw1r_32x512_8.gds
    lef:
      - pdk_dir::libs.ref/sky130_sram_macros/lef/sky130_sram_2kbyte_1rw1r_32x512_8.lef
    vh:
      - pdk_dir::libs.ref/sky130_sram_macros/verilog/sky130_sram_2kbyte_1rw1r_32x512_8.v
    lib:
      "*":
        - pdk_dir::libs.ref/sky130_sram_macros/lib/sky130_sram_2kbyte_1rw1r_32x512_8_TT_1p8V_25C.lib

  sky130_sram_1kbyte_1rw1r_32x256_8:
    gds:
      - pdk_dir::libs.ref/sky130_sram_macros/gds/sky130_sram_1kbyte_1rw1r_32x256_8.gds
    lef:
      - pdk_dir::libs.ref/sky130_sram_macros/lef/sky130_sram_1kbyte_1rw1r_32x256_8.lef
    vh:
      - pdk_dir::libs.ref/sky130_sram_macros/verilog/sky130_sram_1kbyte_1rw1r_32x256_8.v
    lib:
      "*":
        - pdk_dir::libs.ref/sky130_sram_macros/lib/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib

