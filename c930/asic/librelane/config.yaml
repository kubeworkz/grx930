# config.yaml -- LibreLane configuration for the SKY130 chip (c930_soc_top).
#
# This replaces c930/asic/synth_yosys.ys + flow_openroad.tcl, which drove Yosys
# and OpenROAD by hand against a sky130A that CI built with the skywater-pdk
# conda flow. Both scripts read PDK paths that no sky130A layout has
# ($PDK_ROOT/sky130_fd_sc_hd/...) and call a 2020-era OpenROAD API (add_ring,
# add_stripe, legalize_placement), so neither could run against the PDK or the
# engine this repo installs.
#
# PDK handling is the GF180 arms' handling: the same engine in the same image,
# `--manual-pdk` against a prebuilt tree, and nothing here redefines a PDK
# variable. run_librelane.sh fetches that tree with ciel at the commit this
# engine pins in its own pdk_hashes.yaml; the release carries its configuration
# in libs.tech/librelane/config.tcl, which is where PDN_VPITCH, PDN_VOFFSET and
# KLAYOUT_DEF_LAYER_MAP come from. (The 2022-era tag that was fetched before this
# port only had libs.tech/openlane/, the LibreLane 2 layout, so LibreLane 3
# reported every one of those variables as undefined.)
#
# meta version 3 for the same reason: version 2 is the engine that reads the
# old layout.
#
# The source list starts from the SoC as it is simulated. Two groups differ:
#   * c930_ddr.sv is a behavioural DDR model with a testbench write port; the
#     synthesis stub c930_ddr_stub.sv is what the FPGA build maps, and it
#     declares the same module, so only the stub is listed.
#   * the CPU core and caches come from asic_gf180mcu/openlane2_rtl/src, the
#     copies the GF180 arms synthesize (see the note above that block).
# The SoC's boot image reaches Yosys through SYNTH_PARAMETERS, not through a
# parameter in this file: $readmemh resolves a relative HEX_FILE against the
# *step's* working directory (librelane/runs/<tag>/05-yosys-jsonheader and
# .../06-yosys-synthesis), so the path has to be absolute, and only the launcher
# knows where the tree is mounted. run_librelane.sh writes that list beside this
# file as boot_hex.yaml -- BOOT_INIT_FILE first, then any caller-supplied
# SYNTH_PARAMETERS (NAME=VALUE) -- and passes it after this config.
meta:
  version: 3
  flow: Classic

DESIGN_NAME: c930_soc_top

# Paths are relative to this file (c930/asic/librelane/).
VERILOG_FILES:
  # ASIC-only replacement for the FPGA primitive shims (BUFG / DSP48E1).
  - dir::../sky130_asic_wrapper.sv
