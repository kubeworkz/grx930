# -- Corners -----------------------------------------------------------
CORNER SW       x 26..381     y 26..381     gf180mcu_fd_io__cor  R0
CORNER SE       x 3549..3904  y 26..381     gf180mcu_fd_io__cor  R90
CORNER NE       x 3549..3904  y 4739..5094  gf180mcu_fd_io__cor  R180
CORNER NW       x 26..381     y 4739..5094  gf180mcu_fd_io__cor  R270
# Unused sites stay fill: a 75-um site is exactly 7*fill10 + fill5.
# 200 sites total = 29 pad cells + 171 fill sites (+4 trailing fills).
#
# ============================================================
# 5. Bond-out budget (wafer.space 1x1 slot: 56 pads default, up to 168
#    with a custom ring; source: wafer_space_checklist.md line 10)
# ============================================================
#   Power : 20  (10 DVDD + 10 DVSS)
#   Signals:  9  (4 GPIO, UART TX, UART RX, EXT_IRQ, CLK, RST_N)
#   Used  : 29 / 56  -> 27 slots of budget remain
#   Reserve assignment when needed: expansion signals take the next free
#   site next to an existing group (N14.. on the north row, S9.. south);
#   extra power pads pair W/E mid-row. Instantiating a pad costs one site;
#   the ring has 200 sites, so budget (not area) is the limit.
#   Distribution rationale: signals flanked by DVDD/DVSS pairs for return
#   current; clock+reset+IRQ on the quiet south row, GPIO+UART on north.
#
# ============================================================
# 6. Power architecture  (RECORDED DECISIONS)
# ============================================================
#   - Single 5.0 V domain: core VDD/VSS and IO DVDD/DVSS are strapped
#     together at the wrapper (VDD<->DVDD, VSS<->DVSS); no brk2/brk5
#     cells, no domain split. Rationale: one package supply, no IO
#     voltage crossing on this chip. Strap width is a PDN open item (9).
#   - Supply pads: gf180mcu_fd_io__dvdd bonds DVDD, __dvss bonds DVSS
#     (verified: the 60x60 bond rect sits under PIN DVDD resp. PIN DVSS).
#     Core rails VDD/VSS have no bond cell in gf180mcu_fd_io; they are
#     carried around the ring by cor/fill/bi_t (all four pins) and fed
#     only through the straps above.
#   - 10 + 10 supply pads at 75 um: ample bond-wire count for a test
#     chip at GF180; IR drop still needs a PDN check (open item 9).
#   - Nominal voltage: 5.0 V. Std-cell lib is gf180mcu_fd_sc_mcu7t5v0;
#     IO lib has tt_025C_5v00 / ff_125C_5v50 / ss_125C_4v50 corners.
#
# ============================================================
# 7. Signal pad configuration (gf180mcu_fd_io__bi_t, one cell type for
#    every signal so direction can be reassigned during bring-up)
# ============================================================
# Control-pin semantics, verified from the PDK verilog model:
#   Y = PAD & IE            (input path, gated by IE)
#   PAD = A when OE=1       (output path)
#   ~OE & PU -> pull-up;  ~OE & PD -> pull-down
#              OE  IE  PU  PD   A          Y
#   OUT pads (o_gpio[3:0], o_uart_txd):  1   0   0   0   core signal   nc
#   IN pads  (i_clk, i_ext_irq)        :  0   1   0   0   1'b0          core input
#   IN pads  (i_rst_n, i_uart_rxd)     :  0   1   1   0   1'b0          core input
#       (internal pull-up so reset and UART idle-high before/without RTL drive)
#   Control ties are made in the wrapper (grx930_test_chip has no pad or
#   power ports today -- a wrapper top is required, section 10).
#   CS, SL, PDRV0, PDRV1: tied 1'b0 for now. Their encoding is NOT
#   documented anywhere in this tree (open item 3) -- confirm in the
#   GF180MCU I/O datasheet before tapeout; if 00 is minimum drive and
#   the UART/GPIO edges fail, raise PDRV.
#
# ============================================================
# 8. ESD
# ============================================================
#   wafer_space_submission/submission_checklist.md requires "ESD
#   protection on I/O pads". Evidence in this tree that the IO library
#   provides it: gf180mcu_fd_io/mag/ contains comp018green_esd_clamp_
#   v5p0_1/_2/_DVDD/_DVSS and pmos_6p0_esd_40 (5.0 V clamps referenced
#   from the pad cells), and the library GDS matches /esd/.
#   There is NO standalone ESD cell in the LEF set -- protection ships
#   inside the pad/supply cells, so instantiating this ring is what
#   satisfies the checklist. ESD class (HBM/CDM) and whether extra rail
#   clamps are wanted between pads: open item 4.
#
# ============================================================
# 9. Seal ring
# ============================================================
#   26 um band at the die edge, outside the pad band, produced by
#   wafer_space_submission/generate_seal_ring.py; pads start at 26.
#
# ============================================================
# 10. Integration steps when this ring lands (NOT started; the current
#     v8 run is core-only with no CORE_AREA -- see area review section 7)
# ============================================================
#   a. Set config.json: CORE_AREA "441 441 3489 4679" (keeps DIE_AREA).
#   a2. Ring generation: either hand-place per section 4, or generate with
#       the LibreLane padring tool (https://github.com/iop-alliance-
#       librelane/padring, referenced by the old file, up to 168 pads) --
#       if a tool is used, its output must match section 4's tables, which
#       are the signoff intent.
#   b. Add a wrapper top (e.g. grx930_test_chip_top.sv) that instantiates
#      the 29 pad cells + grx930_test_chip, makes the control ties of
#      section 7, the straps of section 6, and exposes only the supply
#      ports. grx930_test_chip itself stays pad-free.
#   c. Teach the OL2 flow about gf180mcu_fd_io: LEF in the macro set,
#      .lib for STA, pad cells pre-placed (FP_MACRO_PLACEMENT or a
#      pad-ring script), GDS merged at streamout from the PDK.
#   d. PDN: connect ring rails VDD/VSS/DVDD/DVSS, strap VDD<->DVDD and
#      VSS<->DVSS, check IR drop (open item 9).
#   e. Re-run TrDRC -> Fill -> RCX -> StreamOut, then Magic/KLayout DRC,
#      LVS, and verify_layers.py (3930 x 5120 @ DBU 0.001, 5 metals).
#
# ============================================================
# 11. Submission package (from the previous file, unchanged requirements)
# ============================================================
#   1. GDS file (final routed layout, incl. pad ring + seal ring)
#   2. LEF (technology + cell)
#   3. Liberty (timing library)
#   4. Verilog (gate-level netlist)
#   5. SPEF (parasitic extraction)
#   6. DRC report (clean)
#   7. LVS report (clean)
#   8. Pad ring configuration (this file)
#   9. Seal ring (included in GDS)
#
# ============================================================
# 12. Open items
# ============================================================
#   1. wafer.space counting convention for "56 I/O pads": total including
#      power (assumed here, per area review section 6) or signal-only.
#      Confirm against the slot spec; only the reserve (27) changes.
#   2. Package bond pitch vs the 75 um cell pitch (1-mil wire packages
#      often want >= 80-90 um) -- confirm with wafer.space package data.
#   3. PDRV0/PDRV1, SL, CS encodings -- GF180MCU I/O datasheet.
#   4. ESD class (HBM/CDM) vs wafer.space rules; extra rail clamps?
#   5. in_c/in_s were skipped in favour of bi_t everywhere; revisit if
#      input-only specs (e.g. Schmitt on i_rst_n) are wanted.
#   6. bi_24t unused (no PDRV pins; role undocumented in this tree).
#   7. 27 reserved bond slots -- assign as features grow.
#   8. Corner rail continuity + rail y-offsets vs row cells: confirm in
#      the PDN build (cor rail taps match pad-cell rail bands by design,
#      but this has not been drawn yet).
#   9. IR drop across the VDD<->DVDD straps and the 10+10 supply pads.
#
# ============================================================
# 13. Reproduction (geometry from the PDK, run at repo root)
# ============================================================
#   python3 c930/asic_gf180mcu/pad_ring_check.py   # re-derives all tables
#   D=c930/asic_gf180mcu/pdk/share/pdk/gf180mcuA/libs.ref/gf180mcu_fd_io/lef
#   grep -H SIZE $D/gf180mcu_fd_io__{bi_t,dvdd,dvss,cor,fill10}.lef
#   awk '/^  PIN /{p=$2} /7.500 2.000 67.500 62.000/{print p}' $D/gf180mcu_fd_io__dvss.lef
