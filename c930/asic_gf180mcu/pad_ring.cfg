# pad_ring.cfg -- pad ring specification for the GRX930 test chip
# wafer.space Run 3, 1x1 slot, GF180MCU, die 3930 x 5120 um, 5LM
#
# Status: REBUILT 2026-10-05 against the PDK in this tree.
#   Replaces the previous file, which (a) listed cell names that do not exist
#   (standard-cell prefix with IO suffixes), (b) got pad pitch wrong by 3.7x
#   (75 um actual, not 280), (c) omitted corners and fill, and (d) assumed
#   wafer.space supplies a "default pad ring". It does not: the Run 3 slot
#   spec says "you must provide your own pad ring and ESD protection"
#   (quoted in c930/doc/gf180mcu_area_budget_review.md section 1).
#   The 56 pads are the slot's bond-out budget only.
#
# Sources of truth (all in this tree, each verified 2026-10-05):
#   IO LEFs     : c930/asic_gf180mcu/pdk/share/pdk/gf180mcuA/libs.ref/gf180mcu_fd_io/lef/
#   IO verilog  : .../gf180mcu_fd_io/verilog/gf180mcu_fd_io.v   (port semantics)
#   IO ESD      : .../gf180mcu_fd_io/mag/comp018green_esd_clamp_v5p0_{1,2,DVDD,DVSS}.mag
#   Slot/area   : c930/doc/gf180mcu_area_budget_review.md
#   RTL top     : c930/asic_gf180mcu/grx930_test_chip.sv (9 signal ports, no power ports)
#
# Nothing under asic_gf180mcu/ consumes this file; it is the ring's spec and
# a submission artifact (Makefile copies it into the submission package).

# ============================================================
# 1. Slot, die, core geometry  (um, die origin bottom-left)
# ============================================================
# Die          : 3930 x 5120          (config.json DIE_AREA "0 0 3930 5120")
# Seal ring    : 26 um band at die edge (generate_seal_ring.py)
# Pad band     : 26 .. 376 from edge   (gf180mcu_fd_io pads: SIZE 75 BY 350)
# Corner cells : 26 .. 381 from edge   (gf180mcu_fd_io__cor is 355 x 355)
# Ring channel : .. 441 from edge      (65 um past pads, 60 um past corners:
#                                       IO power ring + core-side routing)
# CORE_AREA    : "441 441 3489 4679"   -> 3048 x 4238 = 12.92 mm2
#                (= wafer.space's published core area for the slot;
#                 see area review section 3; NOT yet set in config.json)
# ============================================================
# Site arithmetic (every number below is derived, then re-checked by
# pad_ring_check.py):
#   usable horizontal span between corners : 3930 - 2*26 - 2*355 = 3168
#     42 sites x 75 = 3150, trailing fill = 18
#   usable vertical span between corners   : 5120 - 2*26 - 2*355 = 4358
#     58 sites x 75 = 4350, trailing fill = 8
#   total pad sites: 2*42 + 2*58 = 200  (way above the 56-pad budget)
#
# ============================================================
# 2. Cell inventory -- gf180mcu_fd_io, exactly what the LEF dir contains
# ============================================================
# Pad cells (75 x 350, SYMMETRY X Y R90, ORIGIN 0 0):
#   gf180mcu_fd_io__bi_t     bidirectional, full control
#                            ports: CS SL IE OE PU PD A PDRV0 PDRV1 PAD Y
#                                   DVDD DVSS VDD VSS
#   gf180mcu_fd_io__bi_24t   bidirectional without PDRV0/1 (unused here)
#   gf180mcu_fd_io__in_c     input-only, ports: PU PD PAD Y DVDD DVSS VDD VSS
#   gf180mcu_fd_io__in_s     input-only variant (unused here)
#   gf180mcu_fd_io__asig_5p0 5.0 V analog signal (unused here)
# Supply cells:
#   gf180mcu_fd_io__dvdd     75 x 350, bond opening is the DVDD pin;
#                            pins DVDD DVSS VSS (no VDD)
#   gf180mcu_fd_io__dvss     75 x 350, bond opening is the DVSS pin;
#                            pins DVDD DVSS VDD (no VSS)
# Structure:
#   gf180mcu_fd_io__cor      355 x 355 corner
#   gf180mcu_fd_io__fill1/5/10/nc   1 / 5 / 10 / 0.1 x 350 rail filler
#   gf180mcu_fd_io__brk2/brk5       IO power-domain breaks (NOT used, see 6)
# Not used: gf180mcu_ef_io__bi_t (ef family, same LEF dir), OCD/AS libraries.
# Bond opening: Metal3 RECT 7.5 2.0 67.5 62.0 on every pad cell (60 x 60);
#   fill/cor cells have no bond opening (checked: 0 matches in their LEFs).
#
# The previous file's names -- gf180mcu_fd_sc_mcu7t5v0__dvdd/__in/__out/
# __inout/__cp/__bidi -- DO NOT EXIST. They were standard-cell names with
# IO suffixes. Do not reintroduce them.
#
# ============================================================
# 3. Orientations (R90 = CCW; pad cells' bond opening is at the cell's
#    SOUTH end in R0, core-side pins at the north end)
# ============================================================
#   South row : R0    (opening faces south / die edge)
#   North row : R180  (opening faces north)
#   West col  : R270  (opening faces west)
#   East col  : R90   (opening faces east)
#   Corners: the cor cell carries its rail taps on its north and east edges
#   in R0, so corner placement is:
#     SW: R0    (feeds east row + north column)
#     SE: R90   (feeds west row + north column)
#     NE: R180  (feeds west row + south column)
#     NW: R270  (feeds east row + south column)
#   Confirm rail continuity against the PDN build (open item 8).
#
# ============================================================
# 4. Site tables  (bounds are inclusive-start / exclusive-end)
# ============================================================
# -- South row: y 26..376, sites west->east from x=381, R0 -------------
SITE S0         x 381..456    y 26..376   gf180mcu_fd_io__dvdd  DVDD  PWR
SITE S1         x 456..531    y 26..376   gf180mcu_fd_io__bi_t  i_clk      IN
SITE S2         x 531..606    y 26..376   gf180mcu_fd_io__dvss  DVSS  PWR
SITE S3         x 606..681    y 26..376   gf180mcu_fd_io__bi_t  i_rst_n    IN
SITE S4         x 681..756    y 26..376   gf180mcu_fd_io__dvdd  DVDD  PWR
SITE S5         x 756..831    y 26..376   gf180mcu_fd_io__bi_t  i_ext_irq  IN
SITE S6         x 831..906    y 26..376   gf180mcu_fd_io__dvss  DVSS  PWR
SITE S7         x 906..981    y 26..376   gf180mcu_fd_io__dvdd  DVDD  PWR
SITE S8         x 981..1056   y 26..376   gf180mcu_fd_io__dvss  DVSS  PWR
FILL S9..S41    x 1056..3531  y 26..376   33 sites, each 7*fill10 + fill5
