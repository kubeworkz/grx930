# -- West column: x 26..376, sites south->north from y=381, R270 -------
SITE W0         x 26..376   y 381..456    gf180mcu_fd_io__dvdd  DVDD  PWR
SITE W1         x 26..376   y 456..531    gf180mcu_fd_io__dvss  DVSS  PWR
FILL W2..W27    x 26..376   y 531..2481   26 sites, each 7*fill10 + fill5
SITE W28        x 26..376   y 2481..2556  gf180mcu_fd_io__dvdd  DVDD  PWR
SITE W29        x 26..376   y 2556..2631  gf180mcu_fd_io__dvss  DVSS  PWR
FILL W30..W57   x 26..376   y 2631..4731  28 sites, each 7*fill10 + fill5
FILL W-trail    x 26..376   y 4731..4739  fill5 + 3*fill1 = 8
