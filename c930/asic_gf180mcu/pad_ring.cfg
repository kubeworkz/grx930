SITE N5         x 756..831    y 4744..5094  gf180mcu_fd_io__bi_t  o_gpio[2]   OUT
SITE N6         x 831..906    y 4744..5094  gf180mcu_fd_io__dvss  DVSS  PWR
SITE N7         x 906..981    y 4744..5094  gf180mcu_fd_io__bi_t  o_gpio[3]   OUT
SITE N8         x 981..1056   y 4744..5094  gf180mcu_fd_io__dvdd  DVDD  PWR
SITE N9         x 1056..1131  y 4744..5094  gf180mcu_fd_io__dvss  DVSS  PWR
SITE N10        x 1131..1206  y 4744..5094  gf180mcu_fd_io__bi_t  o_uart_txd  OUT
