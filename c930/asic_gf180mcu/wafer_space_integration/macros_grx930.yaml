# macros_grx930.yaml -- the template's macro list (librelane/macros/macros_5v.yaml)
# minus its two foundry SRAM macros, for the grx930 chip-top run.
#
# Why this file exists: macros_5v.yaml declares
#   gf180mcu_fd_ip_sram__sram512x8m8wm1 with instances i_chip_core.sram_0 and
#   i_chip_core.sram_1, and a PDN_MACRO_CONNECTIONS list naming those two.
# Those instances belong to the template's *demo* chip_core.sv, which
# instantiates both SRAMs directly (src/chip_core.sv lines 66 and 83). Our
# chip_core_grx930.sv replaces that module and has no SRAM macro: grx930's memory
# is behavioural RTL inside grx930_test_chip, inferred by synthesis. Leaving the
# declaration in makes OpenROAD.CheckMacroInstances fail -- it reports
#   "No macro instance i_chip_core.sram_0 found."
# and the flow quits at step 11 of 83 (measured, run tag ws_v1, 2026-10-12).
#
# So this is a *config* mismatch, not a design fault: the template's macro list
# describes the demo it shipped with. Everything below the header is the
# template's own ws_ip block, byte for byte, so the QR / shuttle / project /
# marker / logo cells -- which the pre-check's --cob mode requires, and which
# the unmodified chip_top.sv instantiates -- are declared exactly as upstream.
# If the template's ws_ip list ever changes, re-copy lines 1-79 of
# librelane/macros/macros_5v.yaml rather than editing this by hand.

MACROS:
  # required: will be replaced with actual content
  gf180mcu_ws_ip__qrcode_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/gds/gf180mcu_ws_ip__qrcode_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/lef/gf180mcu_ws_ip__qrcode_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/vh/gf180mcu_ws_ip__qrcode_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__qrcode_id/lib/gf180mcu_ws_ip__qrcode_id.lib
    instances:
      qrcode_id:
        location: [26, 26]
        orientation: N

  # required: will be replaced with actual content
  gf180mcu_ws_ip__shuttle_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/gds/gf180mcu_ws_ip__shuttle_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/lef/gf180mcu_ws_ip__shuttle_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/vh/gf180mcu_ws_ip__shuttle_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__shuttle_id/lib/gf180mcu_ws_ip__shuttle_id.lib
    instances:
      shuttle_id:
        location: [26, 175.6]
        orientation: E

  # required: will be replaced with actual content
  gf180mcu_ws_ip__project_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__project_id/gds/gf180mcu_ws_ip__project_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__project_id/lef/gf180mcu_ws_ip__project_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__project_id/vh/gf180mcu_ws_ip__project_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__project_id/lib/gf180mcu_ws_ip__project_id.lib
    instances:
      project_id:
        location: [175.6, 26]
        orientation: N

  # required: top right corner marker
  gf180mcu_ws_ip__marker:
    gds:
      - dir::../ip/gf180mcu_ws_ip__marker/gds/gf180mcu_ws_ip__marker.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__marker/lef/gf180mcu_ws_ip__marker.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__marker/vh/gf180mcu_ws_ip__marker.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__marker/lib/gf180mcu_ws_ip__marker.lib
    instances:
      marker:
        location: ["expr::($DIE_AREA[2] - (245 + 36))", "expr::($DIE_AREA[3] - (245 + 36))"]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: [26, "expr::$DIE_AREA[3] - 169.25"]
        orientation: N

# The template points these at its two demo SRAM instances. This design has no
# macro instance to connect, so the list is explicitly empty rather than
# removed, so a reader does not have to guess whether the template s entries
# still apply.
PDN_MACRO_CONNECTIONS: []
