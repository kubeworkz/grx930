# macros_grx930_sram.yaml -- macros_grx930.yaml plus the foundry 5 V SRAM, for
# the macro-flow surrogate run (scope §7 step 3).
#
# Pass this file INSTEAD of macros_grx930.yaml, not in addition to it: config
# files merge per variable, so a second file declaring MACROS would have to
# restate the whole map. The ws_ip block below (QR / shuttle / project / marker
# / logo -- what the pre-check's --cob mode looks for, and what the unmodified
# chip_top.sv instantiates) is therefore copied byte for byte from
# macros_grx930.yaml; only the SRAM block and the PDN connections are new.
#
# The eight instances are the byte slices of grx930_sram_64kb's macro-backed
# storage (`USE_SRAM_MACRO`): slice i holds bits [8i+7:8i] of every 64-bit word,
# so all eight see the same address and strobes fan out one bit per slice.
#
# Placement is fixed rather than left to the flow (an instance with no location
# is silently ignored -- Odb.ManualMacroPlacement logs "no location configured,
# ignoring"). 4 x 2 in the south-west corner of the core, 60 um in from the core
# boundary (where the template puts its own demo SRAMs, clear of the 25 um core
# ring) with a 20 um channel between neighbours for the PDN straps and DRC:
# 1.79 mm x 0.99 mm of the 3.05 mm x 4.24 mm core, 1.68 mm2 of macro for 2.1 mm2
# of flip-flop array it replaces.

MACROS:
  # required: will be replaced with actual content
  gf180mcu_ws_ip__qrcode_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/gds/gf180mcu_ws_ip__qrcode_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/lef/gf180mcu_ws_ip__qrcode_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__qrcode_id/vh/gf180mcu_ws_ip__qrcode_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__qrcode_id/lib/gf180mcu_ws_ip__qrcode_id.lib
    instances:
      qrcode_id:
        location: [26, 26]
        orientation: N

  # required: will be replaced with actual content
  gf180mcu_ws_ip__shuttle_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/gds/gf180mcu_ws_ip__shuttle_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/lef/gf180mcu_ws_ip__shuttle_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__shuttle_id/vh/gf180mcu_ws_ip__shuttle_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__shuttle_id/lib/gf180mcu_ws_ip__shuttle_id.lib
    instances:
      shuttle_id:
        location: [26, 175.6]
        orientation: E

  # required: will be replaced with actual content
  gf180mcu_ws_ip__project_id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__project_id/gds/gf180mcu_ws_ip__project_id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__project_id/lef/gf180mcu_ws_ip__project_id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__project_id/vh/gf180mcu_ws_ip__project_id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__project_id/lib/gf180mcu_ws_ip__project_id.lib
    instances:
      project_id:
        location: [175.6, 26]
        orientation: N

  # required: top right corner marker
  gf180mcu_ws_ip__marker:
    gds:
      - dir::../ip/gf180mcu_ws_ip__marker/gds/gf180mcu_ws_ip__marker.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__marker/lef/gf180mcu_ws_ip__marker.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__marker/vh/gf180mcu_ws_ip__marker.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__marker/lib/gf180mcu_ws_ip__marker.lib
    instances:
      marker:
        location: ["expr::($DIE_AREA[2] - (245 + 36))", "expr::($DIE_AREA[3] - (245 + 36))"]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: [26, "expr::$DIE_AREA[3] - 169.25"]
        orientation: N

  # Foundry 5 V SRAM: one macro per byte slice of the 64-bit word. Same
  # declaration as the template's macros_5v.yaml (gds/lef/vh/lib all read from
  # the PDK tree), with eight instances instead of its demo pair.
  gf180mcu_fd_ip_sram__sram512x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram512x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram512x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram512x8m8wm1__blackbox_pp.v
    lib:
      "*_tt_025C_5v00":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ss_125C_4v50.lib
    instances:
      # x = 502 + 451.86*column, y = 502 + 504.88*row  (431.86 x 484.88 macros,
      # 20 um channels, 60 um from the core edge at 442).
      i_chip_core.u_core.u_sram.u_macro_0:
        location: [502.0, 502.0]
        orientation: N
      i_chip_core.u_core.u_sram.u_macro_1:
        location: [953.86, 502.0]
        orientation: N
      i_chip_core.u_core.u_sram.u_macro_2:
        location: [1405.72, 502.0]
        orientation: N
      i_chip_core.u_core.u_sram.u_macro_3:
        location: [1857.58, 502.0]
        orientation: N
      i_chip_core.u_core.u_sram.u_macro_4:
        location: [502.0, 1006.88]
        orientation: N
      i_chip_core.u_core.u_sram.u_macro_5:
        location: [953.86, 1006.88]
        orientation: N
      i_chip_core.u_core.u_sram.u_macro_6:
        location: [1405.72, 1006.88]
        orientation: N
      i_chip_core.u_core.u_sram.u_macro_7:
        location: [1857.58, 1006.88]
        orientation: N

# The macro's VDD/VSS are its Metal1-3 edge rails; the PDN grid in
# pdn_cfg_grx930_sram.tcl straps them to the core grid. These four fields per
# instance are <instance> <macro pin> <net> <macro pin> <net>.
PDN_MACRO_CONNECTIONS:
- "i_chip_core.u_core.u_sram.u_macro_0 VDD VSS VDD VSS"
- "i_chip_core.u_core.u_sram.u_macro_1 VDD VSS VDD VSS"
- "i_chip_core.u_core.u_sram.u_macro_2 VDD VSS VDD VSS"
- "i_chip_core.u_core.u_sram.u_macro_3 VDD VSS VDD VSS"
- "i_chip_core.u_core.u_sram.u_macro_4 VDD VSS VDD VSS"
- "i_chip_core.u_core.u_sram.u_macro_5 VDD VSS VDD VSS"
- "i_chip_core.u_core.u_sram.u_macro_6 VDD VSS VDD VSS"
- "i_chip_core.u_core.u_sram.u_macro_7 VDD VSS VDD VSS"
