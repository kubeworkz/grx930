# grx930_overrides.yaml -- wafer.space 1x1 template, configured for the grx930 core.
#
# Passed *last* on the flow command line, after the template's own config files:
#
#   openlane --pdk gf180mcuD --manual-pdk \
#       librelane/slots/slot_1x1.yaml librelane/macros/macros_5v.yaml \
#       librelane/config.yaml librelane/grx930_overrides.yaml
#
# so later keys win. The template's values for everything not listed here
# (pad ring, PDN, SDC, clock port/net, antenna repair, IGNORE_DISCONNECTED_
# MODULES for the ws_ip cells) are used unchanged -- that is deliberate: the
# pre-check compares this part against the same template every other 1x1
# submission uses.
meta:
  version: 3
  flow: Chip

DESIGN_NAME: chip_top

# The template's src/chip_core.sv (a counter demo) is replaced by the adapter;
# the core RTL is the tapeout tree (openlane2_rtl/src) minus the two unused ROM
# modules (c930_bootrom.sv / bootrom_wrapper.sv -- their $readmemh would
# elaborate against a file this flow does not have).
#
# This file is the *design's* config, so `dir::` resolves against this
# directory; the assembler (run_ws_flow.sh) copies the tree so that
# ../src and ../asic_core hold what this expects, and rewrites these two paths
# if it stages them anywhere else.
VERILOG_FILES:
- dir::../src/chip_top.sv
- dir::../src/chip_core.sv
- dir::../asic_core/*.sv

# Same synthesis strategy as the OL2 core runs (their config.json used "AREA 3"),
# so the netlist this flow produces can be compared cell type by cell type with
# openlane2_rtl/runs/slotcore_v1/06-yosys-synthesis/grx930_test_chip.nl.v instead of
# being a different optimisation altogether.
SYNTH_STRATEGY: AREA 3

# 25 MHz. The adapter's CLK_FREQ (and therefore the ROM firmware's UART
# divisor) is tied to this: change one and the banner baud changes silently.
CLOCK_PERIOD: 40

# Placement density. Measured from the OL2 run: 370,059 instances, 6.66 mm2 of
# cell area in a 12.93 mm2 core = 51.6 %. The template's 35 % default is below
# what the design needs, and a placer target under the real density is what
# pushed GPL into 91-94 % local hot spots on the fat layout.
PL_TARGET_DENSITY_PCT: 55

# Detailed-placement displacement window. These two reach
# `detailed_placement -max_displacement {X Y}` (librelane's
# scripts/openroad/common/dpl.tcl) and, through scripts/odbpy/reader.py, the ECO
# buffer/diode placers; global placement does not read them, so this pair only
# constrains legalization. LibreLane's own default for both is 100 um.
#
# Left at 1500/500 for the fresh ws_v3 run. A widening to 10000/10000 (wider than
# the 3932 x 5122 um die) lived here while DPL-0036 was the open failure, on the
# theory that the repair's trailing detailed placement could not legalize its
# new buffers inside the window. With the repair step disabled (see below) no
# step inserts tens of thousands of cells for DPL to place, so the window is not
# the binding constraint, and the cost of an effectively unlimited one -- DPL
# free to move a cell arbitrarily far from where GPL put it, on a design whose
# measured binding constraint is congestion -- is not worth paying for it.
PL_MAX_DISPLACEMENT_X: 1500
PL_MAX_DISPLACEMENT_Y: 500

# ---------------------------------------------------------------------------
# Post-GPL design repair: DISABLED, on measurement. This is what killed ws_v2.
# ---------------------------------------------------------------------------
#
# OpenROAD.RepairDesignPostGPL runs librelane/scripts/openroad/repair_design.tcl,
# which builds its argument list straight out of the config:
#
#   repair_design -verbose \
#       -max_wire_length $::env(DESIGN_REPAIR_MAX_WIRE_LENGTH) \
#       -slew_margin     $::env(DESIGN_REPAIR_MAX_SLEW_PCT) \
#       -cap_margin      $::env(DESIGN_REPAIR_MAX_CAP_PCT)
#
# and, before that, `buffer_ports -inputs/-outputs` when
# DESIGN_REPAIR_BUFFER_INPUT_PORTS / _OUTPUT_PORTS are set.
#
# The direction of those two percentages is the opposite of what their names
# suggest. OpenROAD derates the target limit by the margin
# (src/rsz/src/RepairDesign.cc):
#
#       limit1    *= (1.0 - slew_margin_ / 100.0);
#       max_cap1  *= (1.0 - cap_margin_  / 100.0);
#
# The flags are documented in src/rsz/README.md under "Over-repair": the margin
# exists so the resizer repairs *past* the constraint, on the assumption that
# placement parasitics understate what routing will produce. LibreLane's default
# of 20 is therefore not "tolerate 20 % over the limit" but "repair anything
# above 80 % of the limit".
#
# So the least aggressive setting available was tried first -- both margins at 0,
# which repairs exactly the violations against the real limits and nothing beyond
# them, plus pad buffering off (those two buffer_ports calls terminate nets at the
# pad ring, where the standard-cell rows end and legal sites are scarcest). It is
# not enough, and this is measured rather than inferred. The probe
# (wafer_space_integration/probe_step31.sh) replayed this single step against
# ws_v2's own frozen pre-repair ODB -- `--only OpenROAD.RepairDesignPostGPL` with
# `-i 30-openroad-stamidpnr/state_out.json`, which still points at
# 27-openroad-globalplacement/chip_top.odb -- so input, step logic, PDK and
# netlist are identical and only the knobs differ:
#
#   run               slew viol  cap viol  nets repaired  buffers  area after
#   ws_v2 (margin 20)    17,577     6,776         17,652   97,969     +79.9 %
#   ws_v3_probe (0)      12,676     5,536         12,734   88,590     +73.7 %
#
# -9.6 % buffers for a 27.9 % smaller violation set: the insertion is driven by
# real violations against the real limits, not by the 20 % over-repair, and this
# step has no configuration that caps it. Read the `final` row of its Area meter,
# not a mid-run one -- ws_v3_probe read +25.8 % at iteration 209,000 and +73.7 %
# on `final`.
#
# Where the mass comes from, from the run's own logs:
#
#   30-openroad-stamidpnr  max slew violation count 157453, cap 5945, fanout 99
#   31-...repairdesignpostgpl
#     RSZ-0034  Found 17577 slew violations
#     RSZ-0035  Found 98 fanout violations
#     RSZ-0036  Found 6776 capacitance violations
#     RSZ-0038  Inserted 97969 buffers in 17652 nets
#     RSZ-0042  Inserted 178 tiel + 125 tieh
#
# 97,969 buffers on 17,652 nets is ~5.6 buffers per net, +79.9 % cell area,
# inserted into a placement that 30-openroad-stamidpnr/state_out.json records at
# 43.75 % instance utilization (43.21 % stdcell) -- i.e. it takes the design to
# roughly 79 % full, and the detailed placement the step then runs
# (`source scripts/openroad/common/dpl.tcl`) aborts on it:
#
#   31-openroad-repairdesignpostgpl.log:358  + detailed_placement -max_displacement  1500 500
#   31-openroad-repairdesignpostgpl.log:359  [INFO DPL-0034] Detailed placement failed on the following 23 instances:
#   31-openroad-repairdesignpostgpl.log:383  [ERROR DPL-0036] Detailed placement failed.
#   31-openroad-repairdesignpostgpl.log:384  Error: repair_design.tcl, 71 DPL-0036
#   logs/ws_flow.ws_v2.log:58391            WS_EXIT:2
#
# 157,453 slew violations is a large number and two facts bound how much of it
# is real: the measurement is mid-PnR with the clock not yet propagated
# (unpropagated.rpt is empty, WNS -574 ns, report_clock_min_period 614 ns against
# a 40 ns clock), and all 52 warnings the step raised are the harmless STA-1140
# duplicate-Library read.
#
# DISABLED, because that measurement leaves nothing else. LibreLane's own switch
# for the step is RUN_POST_GPL_DESIGN_REPAIR ("Enables resizer design repair
# after global placement using the OpenROAD.RepairDesignPostGPL step", default
# true); false skips it, and with it the trailing detailed placement that aborted
# the flow, so the flow reaches CTS and routing instead of dying in placement.
# Drive-strength repair is not lost by doing this: the Chip flow still runs
# OpenROAD.ResizerTimingPostCTS (step 37, RUN_POST_CTS_RESIZER_TIMING) and
# OpenROAD.ResizerTimingPostGRT (step 45, RUN_POST_GRT_RESIZER_TIMING), both
# after the clock is propagated and on parasitics estimated from a real clock
# tree -- a strictly better place to fix slew than a pre-CTS placement with
# estimated wires -- and OpenROAD.DetailedPlacement (step 34) still runs the same
# DPL the skipped step would have run.
#
# What is given up: the ~157k pre-CTS slew violations are no longer touched
# before CTS, so any that are real are left to those two resizer steps or show up
# as sign-off findings (Checker.MaxSlewViolations, step 78). What is bought: the
# repair no longer triples the cell count and fills the layout to ~79 % before
# CTS -- on a design whose measured binding constraint is routing congestion, an
# extra 88-98k cells sitting in the placement ahead of CTS is a cost carried into
# global routing for no benefit the post-CTS resizer cannot provide.
#
# The DESIGN_REPAIR_* values are left at their least aggressive setting while the
# step is off, so that re-enabling it starts from there rather than from
# LibreLane's 20/20. They are inert until that happens.
DESIGN_REPAIR_MAX_SLEW_PCT: 0
DESIGN_REPAIR_MAX_CAP_PCT: 0
DESIGN_REPAIR_MAX_WIRE_LENGTH: 0
DESIGN_REPAIR_BUFFER_INPUT_PORTS: false
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false
RUN_POST_GPL_DESIGN_REPAIR: false

# Power distribution. The template's pdn_cfg.tcl ends by sourcing its SRAM stripe
# grid (pdn_5v_sram.tcl, or pdn_3v3_sram.tcl when SRAM_DEFINE says so), and that
# grid stripes around i_chip_core.sram_0 / sram_1 -- the two foundry SRAM macros
# the template's demo chip_core.sv instantiates. grx930's chip_core has no SRAM
# macro (its memory is behavioural RTL, inferred by synthesis), so this run uses
# pdn_cfg_grx930.tcl: the template's file with that one block removed and
# everything else byte for byte. Same mismatch class as the macro declaration
# that stopped run ws_v1 at step 11 (OpenROAD.CheckMacroInstances).
PDN_CFG: dir::pdn/pdn_cfg_grx930.tcl

# Global-route capacity reservation.
#
# Why this is a decision and not a default: the OL2 config had it at 0.0 (a hack
# to get GRT's own congestion report under a threshold), the guides it produced
# were packed to the theoretical limit, and DRT could not realise them -- it
# diverged after 17 iterations at ~1 conflict per net pair (222 k unique net
# pairs, half at cell-pin geometry). Stock is 0.3, i.e. GRT plans with 70 % of
# each edge's capacity, leaving DRT the headroom for vias, jogs and pin escape.
#
# Evidence (fast DRT, 2 iterations, Metal1-Metal5, same six detailed_route
# arguments in every row; captured by build/arm_verdict_capture.sh into
# drt_fast/verdict/arm_compare.md):
#
#   arm                              iter0      iter1     iter2     DRT-0199   GRT wire   after diodes
#   fat core,   GRT 0.0 (baseline)   1,081,775  405,529   387,049   -          24.22 M um 24.29 M um  <- diverged
#   slot core,  GRT 0.0 (arm 1)      1,096,857  435,492   418,613   418,633    24.30 M um 24.44 M um
#   slot core,  GRT 0.3 (arm 2)        659,733  207,748   191,575   191,578    28.73 M um 29.58 M um
#
# The two slot rows are a matched pair: same design dir, same PDK, same core
# geometry, same DRT arguments, and each input ODB is the endpoint of the same
# flow with only GRT_ADJUSTMENT changed (arm 1's input is the 0.0 GRT step's
# output, 203,851,717 B; arm 2's the 0.3 step's, 219,661,871 B).
#
# CORRECTION. An earlier version of this table gave arm 1's wirelength as
# 19.63 M um and claimed the slot core "carries 19 % LESS wire". That was the
# floorplan experiment's *prediction* (sqrt(0.648) x 24,215,167 ~ 19.4 M um)
# written down as if measured. The measurement is 24,301,804 um -- +0.4 % versus
# the fat baseline, i.e. the core shrink did NOT reduce wirelength. It makes
# sense against the density map: the cells were already packed in a hot middle
# band over a sparse skirt, and removing the skirt pulls cells together rather
# than shortening the long nets. Measure, do not scale.
#
# Arm 1 alone: 1,096,857 -> 435,492 -> 418,613 against the fat baseline's
# 1,081,775 -> 405,529 -> 387,049, i.e. +1.4 % / +7.4 % / +8.2 % worse at every
# stage. The 12.93 mm2 core is the shuttle-mandated layout, not a PPA win: it
# trades nothing in wire and loses a little on violations.
#
# VERDICT (arm 2 COMPLETE, 11:11 UTC): 0.3 wins the primary criterion, 2.19x --
# 191,578 final violations against 418,633, in 1:20:31 versus 3:06:08 of DRT and
# at 7,024 MB versus 6,418 MB peak. Arm 2's plateau is still falling (-7.8 % per
# iteration) where arm 1's has nearly stopped (-3.9 %), and arm 1 cannot close
# the gap: at its own rate it would need ~20 more iterations (~18 h) even if the
# rate held, and DRT's rate decelerates. So the value below is no longer
# provisional.
#
# The rule that was pre-registered here said: "if arm 2's GRT log shows overflow
# ('extra iterations to remove overflow'), 0.3 is unaffordable and the lever
# moves to placement." That clause turned out to be broken as a test -- it fires
# on BOTH arms, because the 0.0 arm logs the same line and then clears its own
# overflow (0 on every layer, 12.18 % usage). The discriminating line is
# `WARNING GRT-0115 Global routing finished with overflow`, which appears ONLY
# at 0.3: 15,155 unresolved across M1-M5. Read strictly, the guard therefore
# says "unaffordable" -- yet DRT says 0.3 is twice as routable.
#
# Both readings are kept on the record and 0.3 is kept because the guard scored
# the mechanism, not the outcome. The reservation is what *produces* that
# overflow: GRT is told each edge has ~34 % less capacity, so it goes over its
# own budget by construction and pushes demand up to M3/M4 (usage 12.3 -> 24.9 %
# and 6.9 -> 19.9 % of true capacity). With GRT_ALLOW_CONGESTION that is
# informational, not an error. The question the guard meant to ask -- does
# reserving capacity pay out at DRT? -- has a measured answer, and it is yes.
#
# Cost that this experiment does NOT address: wirelength +18.2 %
# (24.30 -> 28.73 M um), +21.0 % after diode insertion. Both figures are GRT
# estimates against GRT estimates, so the delta is sound but the level is
# optimistic -- on this design GRT over-estimates routed wire by ~25 % (v8: GRT
# 24.3 M vs 19.4 M measured from the ODB). Neither arm reaches a routed result,
# so the true routed-wire penalty is unmeasured. Treat 0.3 as a starting point:
# the knee is somewhere in 0.1-0.3, and a 0.1/0.2 arm is the next measurement,
# not more DRT iterations.
#
# Nor is 0.3 net-faster end to end: the flow tail that feeds DRT gets 23x slower.
# Per-step runtime.txt on the same run tag, 0.0 (steps 38-41) vs 0.3 (42-45):
#
#   globalrouting                     3:14  ->  1:17:46    24.0x
#   repairantennas (diode insertion)  8:45  ->  4:24:27    30.2x
#   tail total                       14:34  ->  5:45:27    23.7x
#
# The DRT saving (3:06:08 -> 1:20:31) is therefore partly given back and the
# segment costs +3:45 net. GRT spends 78 min instead of 3 iterating on a graph
# it has been told is over budget, and antenna repair spends 4.4 h instead of
# 9 min fixing what those guides left -- the pre-DRT ODB is 7.7 % larger
# (203,851,717 -> 219,661,871 B), i.e. more diodes. This bounds the verdict
# rather than reversing it: 418,633 violations is not a viable endpoint at any
# speed, and 0.3 is the only arm trending toward zero. But it does make the
# 0.1/0.2 arm the higher-value next run -- a smaller reservation that keeps most
# of the violation win should also keep the tail cheap.
#
# SUPERSEDED by that run (2026-10-12 19:18 UTC). The 0.1 and 0.2 arms are in;
# full verdict in Claude outputs/grt_adjustment_sweep.md, raw table in
# drt_fast/verdict/grt_sweep.md. Same instrument per arm: resume the same run tag
# from OpenROAD.GlobalRouting to OpenROAD.RepairAntennas with only
# GRT_ADJUSTMENT changed, then fast DRT (2 iterations, Metal1-Metal5).
#
#   adj   iter2 / DRT-0199   GRT wire (um)  flow tail   DRT wall   net vs 0.0   overflow
#   0.0        418,633        24,301,804     14:34      3:09:36        --            0
#   0.1        344,494        24,897,381     18:21      1:47:04    -1:18:45          0
#   0.2        254,201        25,323,984     22:27      1:32:23    -1:29:20          0
#   0.3        191,578        28,725,060   5:45:27      1:23:33    +3:44:50     15,155
#
# THE KNEE IS 0.2, NOT 0.3. The violation win is not flattening anywhere in
# 0.0-0.2: its marginal yield PEAKS at the 0.1->0.2 step (-90,283, the largest in
# the sweep, versus -74,139 before it and -62,626 after) and that ordering holds
# at the initial route, iteration 1 and iteration 2 alike, so it does not depend
# on the 2-iteration cutoff. On cost, 0.2 is the cheapest point measured, not a
# compromise: wire paid per violation removed is 8.0 / 6.2 / 19.5 um cumulatively
# and 8.0 / 4.7 / 54.3 um marginally, i.e. the 0.2->0.3 increment costs 11.5x the
# previous increment and 0.3 pays 3.4 M um of extra wire -- the same violation
# mass (62,626) that 0.1->0.2 removed for 8x less. The flow tail grows near-
# linearly to 0.2 (+3:47, then +4:04, ~+2 min per +0.1) and then multiplies by
# 17.3x at 0.3. Net of the DRT it buys back, 0.1 and 0.2 are both FASTER end to
# end than 0.0 (-1:18:45 and -1:29:20) and 0.3 is the only arm that is slower
# (+3:44:50). An independent instrument agrees: `GRT-0115 finished with overflow`
# is absent at 0.0/0.1/0.2 and present only at 0.3 (15,155 units) -- the first
# reservation that over-commits GRT's own reduced budget. So 0.2 takes 72.4 % of
# the total violation win for 23 % of 0.3's wire premium, at the best efficiency,
# the lowest total time and no over-commitment.
#
# This CHANGES the rule that was pre-registered above ("whichever arm reaches the
# lower iteration-2 plateau sets GRT_ADJUSTMENT"). That rule scores violation
# count and ignores cost, so it selects 0.3 by construction; the sweep was run
# because it cannot answer the question that matters. Cost is now measured.
#
# MEASURED ON THE ASSEMBLED DIE (2026-10-13, ws_v3 step 37): 0.2 DOES NOT RUN. GRT
# aborts with `[ERROR GRT-0183] Net net21814: heap underflow during 3D maze
# routing` after its 14th overflow-removal iteration (6:58 wall, 3 GiB peak), and
# it is deterministic: resuming the frozen step-36 state with this file unchanged
# reproduces the same net at the same iteration. So the value below is 0.1, not
# 0.2, and the reason is not that 0.2 is wrong about DRT -- it is that 0.2 never
# reaches DRT on the pad-ring die.
#
# What GRT-0183 means, from upstream source rather than from the message. In
# `mazeRouteMSMDOrder3D` the maze expansion gives up when the source subtree's
# priority queue empties before it reaches the destination subtree -- "no path
# could be found within the search region" for that edge (OpenROAD PR #10711,
# which stops treating it as fatal and keeps the edge's original route via
# `recoverEdge`; merged Aug 2026). A sibling fix, PR #11093 (merged 2026-08-07),
# is a FastRoute gcell-capacity defect: `initBlockedIntervals` rounded each
# blocked interval up to a track separately, so the charge depended on how the
# blocked metal happened to be fragmented and could rise when metal was removed --
# "mainly impacts Metal 1 resources". This image pins `openroad-2026-02-17`
# (LibreLane 3.1.0.dev1), so BOTH post-date it: the no-path state is what the
# configuration reaches, and the abort is what this build does when it reaches it.
#
# The boundary, measured with `wafer_space_integration/probe_grt.sh` -- one knob
# changed per arm, same frozen state, each arm ~7 min / 3 GiB:
#
#   arm                        iterations  final overflow   GRT-0115   wire (um)
#   ws_v3 as-is (0.2)          abort at 14  --               --         --
#   0.1 (this file)                       8   0 everywhere      no       39,459,512
#   0.15                                 12   18 (M2 2, M4 16)  yes      41,057,898
#   GRT_OVERFLOW_ITERS 1                  1   63,525 (M2 47,168) yes      39,475,195
#   M1 layer adjustment -0.2 (0.2 kept)  13   7                 yes      41,205,578
#
# 0.1 is the value landed because it is the one that PASSES AND CONVERGES: zero
# overflow on every layer, no GRT-0115, 8 iterations. 0.15 also completes but
# stops 18 units short of its own budget, which is the mini-0.3 signature; and the
# M1-relax arm, which keeps this 0.2 reservation on M2-M5 (their resources are
# byte-identical to the 0.2 arms: 2,255,039 / 2,467,749 / 2,157,644 / 1,351,235)
# and gives Metal1 +52 % (709,799 -> 1,080,188), completes with 7 units left -- so
# the failing region was not "Metal1 out of tracks", it was a local no-path that
# more capacity ANYWHERE breaks. Metal1's own usage is 7.6-8.6 % against Metal2's
# 59-61 %, i.e. the pressure is on the vertical layers and Metal1 was never the
# binding one.
#
# THE FALSIFIER, recorded rather than buried. One measurement still favours 0.3:
# its per-iteration gain is -7.8 % where 0.0/0.1/0.2 have settled into -3.9 %,
# -3.7 % and -4.3 %. At equal iteration count 0.3 is further from its own
# asymptote, so its violation advantage could widen with more iterations, and a
# 2-iteration DRT cannot settle an asymptote. If a full-length DRT run shows 0.2's
# plateau stalling far above 0.3's, the value below goes back to 0.3. The decisive
# next measurement is 0.2 vs 0.3 at full iteration count on the same layout pair
# -- not more sweep points, and not more fast arms.
# 0.1, not 0.2: see the die-level measurement at the end of the block above.
# What it costs is the DRT half of the sweep: on the slot core 0.1 finished DRT
# with 344,494 violations against 0.2's 254,201, i.e. +90,293 (2 iterations,
# Metal1-Metal5, same six arguments -- the table above). That cost is real but it
# is a cost of RUNNING, and 0.2 does not run: the choice here is between a route
# that reaches detailed routing at 0.1 and a fatal abort at 0.2. The die's own DRT
# at 0.1 IS measured now (build/die_drt_chain.sh, tag die02, 2026-10-14): 353,871
# initial route -> 213,354 -> 204,357 at iteration 2 (2 iterations, Metal1-Metal5,
# 8 threads, -or_seed 42 -- the slot-core arms' protocol), 1:15:42 wall, 8,123 MB
# peak, curve classified CONVERGING. That is cleaner than the slot core at 0.2
# (254,201), so the give-back's price on the layout that ships is smaller than the
# sweep's core-side number -- see Claude outputs/die_drt_at01.md.
# What it does NOT yet do is make the flow reach detailed routing: on the pinned
# build the die now dies one step later, in OpenROAD.RepairAntennas ->
# OpenROAD.DiodeInsertion, where repair_antennas' own global-router pass hits the
# same fatal GRT-0183 (net _167563_) after 3,846 jumpers and 2,522 diodes. The
# measurement above therefore runs on the post-GlobalRouting database with the
# composite skipped (-c RUN_ANTENNA_REPAIR=false) -- the only pre-DRT state the
# die reaches here; see Claude outputs/ws_run3_readiness_gaps.md section 1b.
# Revisit this value if the engine pin ever moves past the two Aug 2026 GRT fixes
# (PR #11093 capacity, PR #10711 recoverEdge): with the abort made recoverable,
# 0.2 becomes runnable again and the sweep's DRT numbers are the ones to pick from.
GRT_ADJUSTMENT: 0.1
GRT_ALLOW_CONGESTION: true

# Measured on OL2: Metal2 as the bottom layer produced 13-20 M initial-route
# violations and died; Metal1 produced 1.08 M and got to 237 k. Keep Metal1.
RT_MIN_LAYER: Metal1

# The template already sets DRT_ANTENNA_REPAIR_ITERS 10 / MARGIN 10; repeated
# here so the intent survives someone editing the template.
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10

# ---------------------------------------------------------------------------
# Detailed-router iteration cap: 8, not the router's default 64.
# ---------------------------------------------------------------------------
#
# `DRT_OPT_ITERS` is the `OpenROAD.DetailedRouting` variable that lands on
# TritonRoute's `-droute_end_iter` (installed LibreLane 3.1.0.dev1:
# steps/openroad.py declares it `default=64`, scripts/openroad/drt.tcl:88 does
# `lappend drt_args -droute_end_iter $::env(DRT_OPT_ITERS)`). Unset -- which is
# what ws_v3 ran with -- it resolves to 64.
#
# One cap, up to eleven routing jobs. The STEP runs DetailedRouting once
# (flows/classic.py:87, gated by RUN_DRT), but the step contains a loop:
# drt.tcl:85-121 routes the design (drt-run-0), then keeps running
# check_antennas / repair_antennas and re-routing (drt-run-1, ...) while diodes
# are actually being inserted, up to DRT_ANTENNA_REPAIR_ITERS times -- 10 here --
# and every pass gets a fresh `-droute_end_iter` budget from this key. So the
# step's worst case is (1 + DRT_ANTENNA_REPAIR_ITERS) x (initial route +
# DRT_OPT_ITERS iterations), and the figure two paragraphs down is PER PASS.
# In practice the loop exits as soon as antenna repair stops inserting diodes,
# and what bounds the whole step is the per-pass curve -- which is what
# wafer_space_integration/watch_drt_curve.sh watches, writing the verdict
# (converging / stalled / diverged / clean) automatically rather than leaving a
# step of this length to be eyeballed.
#
# What the default costs, measured rather than assumed:
#
#   * Per-iteration wall on THIS layout. Fast loop, 12.93 mm2 slot core, 8
#     threads, GRT_ADJUSTMENT 0.2, from drt_fast/logs/grt02_drt.log's own
#     DRT-0267 lines: initial route 37:55, then 26:05 and 25:25 for optimization
#     iterations 1 and 2. Eight threads is what this flow resolves to as well
#     (`DRT_THREADS` unset -> machine thread count, and the box has 8), so the
#     two instruments are comparable. The default 64 therefore budgets
#     ~38 min + 64 x ~26 min = ~28 h of detailed routing, and that is a floor:
#     the fast loop routes the bare core ODB while this flow routes the
#     assembled die.
#   * The only UNBOUNDED DRT run this design has, v8 (fat core, GRT 0.0),
#     occupied step 43-openroad-detailedrouting from 2026-10-01 01:26 to
#     2026-10-11 15:58 -- 10.6 days for 26 optimization iterations -- and its own
#     DRT-0267 lines record single iterations of 34 min early on growing to
#     16-27 h later. That is the "days" this cap removes.
#
# What the cap costs in violations. The only full-length violation curve on this
# design is v8's (fat core, GRT 0.0), because no unbounded run exists on the
# tapeout layout; the tapeout curve is measured only to iteration 2. On the
# tapeout layout, at 0.2, the fast loop gives 764,679 -> 265,661 -> 254,201,
# and its first three points are byte-identical to v8's, so a cap changes
# nothing about iterations 0-2 -- it only truncates what follows:
#
#   iteration   0          1         2         4         8         12        16        17        25
#   v8 viols    1,081,775  405,529   387,049   266,147   254,306   242,556   237,089   649,172   711,100
#   vs floor    +844,686   +168,440  +149,960  +29,058   +17,217   +5,467    0         +412,083  +474,011
#
#   * The minimum is INTERIOR. Iteration 16 is the best point the unbounded
#     router reached (237,089); iteration 17 is 2.74x worse (649,172) and
#     iteration 25 spikes to 711,100 (3.0x). Uncapped iterations do not buy a
#     better route here, they buy a longer walk that can end far above the
#     router's own best.
#   * cap 2 (the fast-loop convention the sweep tables were measured at):
#     387,049, i.e. 149,960 violations (63.2 %) above that floor.
#   * cap 8 (this file): 254,306, i.e. 17,217 (7.3 %) above it, and by iteration
#     8 the curve is inside its plateau (-0.5 % to -0.8 % per iteration), so
#     those 17,217 are the tail of the curve -- on v8 the iterations that
#     removed them were the ones measured in hours each, not minutes.
#   * cap 16 recovers exactly those 17,217 and doubles the wall clock to ~7 h.
#
# So 8 is the knee of that trade: a routing verdict in ~4 h (38 min + 8 x 26 min)
# per pass instead of ~28 h to 10.6 days, inside the measured plateau, and
# stopped before the observed divergence onset. The number is a decision, not a measurement:
# this run is what measures the tapeout layout's own curve, and if it is still
# falling steeply at 8 the cap is what to raise first.
#
# Two things this cap is NOT:
#
#   * Not a way to pass. The tapeout layout is at 254,201 TrDRC violations after
#     2 iterations on the core, and ERROR_ON_TR_DRC is True with threshold 0, so
#     the step fails at the checker whatever the cap is. The cap buys a VERDICT
#     -- converging, stalled or diverging -- not a clean route.
#   * Not a block on the open falsifier experiment (0.2 vs 0.3 at full iteration
#     count, Claude outputs/grt_adjustment_sweep.md). That runs in the standalone
#     fast loop, whose FAST_END_ITER is independent of this file. Raise or remove
#     this key only for a deliberate full-length FLOW DRT.
DRT_OPT_ITERS: 8
