# build-gds.yml — CI pipeline for GRX930 SKY130 GDS generation
#
# Triggers on every push to main and on pull requests.
# Installs the toolchain from two sources -- oss-cad-suite for yosys and iverilog,
# the OpenROAD .deb plus source builds of Magic and Netgen for place & route, DRC
# and LVS -- then runs synthesis, P&R, DRC, LVS and archives the GDS artifact.

name: Build GDS (SKY130)

on:
  push:
    branches: [main]
    paths:
      - 'c930/rtl/**'
      - 'c930/rv64imac/**'
      - 'c930/asic/**'
      - '.github/workflows/build-gds.yml'
  pull_request:
    branches: [main]
    paths:
      - 'c930/rtl/**'
      - 'c930/rv64imac/**'
      - 'c930/asic/**'
  workflow_dispatch:  # Allow manual trigger

env:
  BUILD_DIR: c930/asic/build
  PDK_ROOT: /opt/pdk/sky130A
  OSSCAD_DIR: /opt/oss-cad-suite
  # oss-cad-suite dates its releases twice, in two different spellings: the
  # release *tag* is YYYY-MM-DD and the *asset* filename is YYYYMMDD. They are
  # not interchangeable. This file used to build the download URL out of the
  # asset spelling, i.e. .../download/20260916/..., which has never existed:
  # the tag is 2026-09-16. wget -q turned that 404 into a bare "exit code 8"
  # three seconds into the job, and the job stayed red for a month.
  OSSCAD_TAG: '2026-09-16'          # release tag, YYYY-MM-DD
  OSSCAD_BUILD: '20260916'          # release asset date, YYYYMMDD
  ASIC_DIR: /opt/asic-tools
  # OpenROAD has no prebuilt for 24.04: the newest .deb is an ubuntu-22.04 build
  # that needs libpython3.10 and tcl-tclreadline, neither of which 24.04 ships,
  # so this job runs on a 22.04 image instead of bending 24.04 around it. The
  # same package supplies OpenSTA -- it installs /usr/bin/openroad *and*
  # /usr/bin/sta -- which is why there is no separate OpenSTA build below.
  OPENROAD_DEB_TAG: '2024-12-14'
  OPENROAD_DEB: openroad_2.0-17598-ga008522d8_amd64-ubuntu-22.04.deb

jobs:
  build-gds:
    name: Synthesize, P&R, DRC/LVS
    runs-on: ubuntu-22.04
    timeout-minutes: 180  # 3-hour timeout for full flow

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Cache oss-cad-suite (saves ~10 min per run) ──────────
      - name: Cache oss-cad-suite
        id: cache-oss
        uses: actions/cache@v4
        with:
          path: /opt/oss-cad-suite
          key: oss-cad-suite-linux-x64-${{ env.OSSCAD_BUILD }}

      # ── Install oss-cad-suite (Yosys, iverilog, sby, ...) ────
      - name: Install oss-cad-suite
        if: steps.cache-oss.outputs.cache-hit != 'true'
        run: |
          set -u
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSSCAD_TAG}/oss-cad-suite-linux-x64-${OSSCAD_BUILD}.tgz"
          echo "Fetching $url"
          # curl, not `wget -q`: -q prints nothing on a 404, which is how a
          # mistyped tag cost a month of unreadable failures. --retry covers the
          # release CDN's occasional 502 on a 700 MiB asset.
          code=$(curl --silent --show-error --location \
                      --retry 3 --retry-all-errors \
                      --output /tmp/oss-cad-suite.tgz \
                      --write-out '%{http_code}' "$url") || code=000
          if [ "$code" != 200 ]; then
            echo "::error::oss-cad-suite download failed with HTTP $code from $url"
            echo "Tag and asset are spelled differently on purpose: tag=$OSSCAD_TAG asset=*$OSSCAD_BUILD.tgz"
            echo "Check with: gh api repos/YosysHQ/oss-cad-suite-build/releases/tags/$OSSCAD_TAG"
            exit 1
          fi
          ls -l /tmp/oss-cad-suite.tgz
          sudo mkdir -p /opt
          # Explicit, not left to the runner's `bash -e`: a partial extraction must
          # fail here, at the step that owns it.
          tar xzf /tmp/oss-cad-suite.tgz -C /opt/ || {
            echo "::error::tar failed extracting oss-cad-suite $OSSCAD_BUILD"
            exit 1
          }
          rm -f /tmp/oss-cad-suite.tgz
          # Prove the extraction produced a usable suite rather than trusting tar's exit code.
          test -x "$OSSCAD_DIR/bin/yosys" || {
            echo "::error::extraction produced no $OSSCAD_DIR/bin/yosys"
            ls -l /opt
            exit 1
          }
          echo "oss-cad-suite $OSSCAD_BUILD installed at $OSSCAD_DIR"

      # ── Put the suite on PATH ─────────────────────────────────
      # This has to run on both paths. It used to sit inside the install step,
      # which is skipped on a cache hit -- so the *second* run would have failed
      # every tool check with "command not found", looking like a broken cache.
      - name: Add oss-cad-suite to PATH
        run: echo "$OSSCAD_DIR/bin" >> $GITHUB_PATH

      # ── Verify the suite is callable ─────────────────────────
      - name: Verify oss-cad-suite
        run: |
          echo "=== oss-cad-suite tools ==="
          yosys --version
          iverilog -V | head -1

      # ── ASIC toolchain: system libraries ─────────────────────
      # Always runs. magic and netgen link against these at *run* time, so they
      # cannot live in the cache-gated build step -- a cache hit would skip them
      # and the tools would fail to load, exactly the trap the suite's PATH
      # export fell into.
      - name: Install ASIC toolchain dependencies
        run: |
          sudo apt-get update -qq
          # curl and ca-certificates are named here rather than assumed: the next
          # step downloads the .deb with curl, and a missing curl showed up as
          # "HTTP 000" instead of "command not found".
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential git ca-certificates curl m4 csh tcl-dev tk-dev \
            libcairo2-dev libglu1-mesa-dev libncurses-dev libx11-dev

      # ── ASIC toolchain: OpenROAD + OpenSTA (prebuilt) ────────
      # A 57 MiB .deb rather than a source build: OpenROAD's Bazel build is a
      # 40+ minute affair that would not fit beside a P&R run in the job budget.
      - name: Install OpenROAD and OpenSTA
        run: |
          set -u
          url="https://github.com/Precision-Innovations/OpenROAD/releases/download/${OPENROAD_DEB_TAG}/${OPENROAD_DEB}"
          echo "Fetching $url"
          code=$(curl --silent --show-error --location \
                      --retry 3 --retry-all-errors \
                      --output /tmp/openroad.deb \
                      --write-out '%{http_code}' "$url") || code=000
          if [ "$code" != 200 ]; then
            echo "::error::OpenROAD .deb download failed with HTTP $code from $url"
            echo "Check with: gh api repos/Precision-Innovations/OpenROAD/releases/tags/$OPENROAD_DEB_TAG"
            exit 1
          fi
          sudo apt-get install -y /tmp/openroad.deb
          rm -f /tmp/openroad.deb
          echo "openroad: $(openroad -version | head -1)"
          echo "opensta : $(sta -version | head -1)"

      # ── ASIC toolchain: Magic + Netgen (source) ──────────────
      # Neither has a package on 22.04 and both build in seconds, so the slow
      # part of bringing them up is only the apt step above -- which is why the
      # build itself is safe to cache by prefix.
      - name: Cache Magic and Netgen
        id: cache-asic
        uses: actions/cache@v4
        with:
          path: /opt/asic-tools
          key: asic-tools-linux-x64-v1

      - name: Build Magic and Netgen
        if: steps.cache-asic.outputs.cache-hit != 'true'
        run: |
          set -u
          work="$RUNNER_TEMP/tools"
          mkdir -p "$work"
          sudo mkdir -p "$ASIC_DIR"

          echo "=== magic ==="
          git clone --depth 1 -q https://github.com/RTimothyEdwards/magic "$work/magic"
          cd "$work/magic"
          ./configure --prefix="$ASIC_DIR" --with-tcl --with-tk --with-cairo
          make -j"$(nproc)"
          sudo make install

          echo "=== netgen ==="
          git clone --depth 1 -q https://github.com/RTimothyEdwards/netgen "$work/netgen"
          cd "$work/netgen"
          ./configure --prefix="$ASIC_DIR"
          make -j"$(nproc)"
          sudo make install

          test -x "$ASIC_DIR/bin/magic"  || { echo "::error::magic was not installed to $ASIC_DIR/bin"; exit 1; }
          test -x "$ASIC_DIR/bin/netgen" || { echo "::error::netgen was not installed to $ASIC_DIR/bin"; exit 1; }

      - name: Add ASIC tools to PATH
        run: echo "$ASIC_DIR/bin" >> $GITHUB_PATH

      # ── Verify the ASIC tools the flow steps need ────────────
      # oss-cad-suite is an FPGA/formal suite and ships none of these; they come
      # from the OpenROAD .deb plus the two source builds above. Checked by name
      # and version here so a broken install fails at this step rather than as a
      # "command not found" three steps later.
      - name: Verify ASIC toolchain
        run: |
          set -u
          # Each tool spells "print my version" differently; there is no common
          # flag. Probing them generically would report a false failure.
          probe() {
            case "$1" in
              openroad) openroad -version 2>&1 | head -1 ;;
              sta)      sta -version 2>&1 | head -1 ;;
              magic)    magic --version 2>&1 | head -1 ;;
              netgen)   echo quit | netgen -batch 2>&1 | head -1 ;;
            esac
          }
          missing=""
          # `sta` is OpenSTA's binary; the OpenROAD .deb installs it.
          for tool in openroad sta magic netgen; do
            if ! path=$(command -v "$tool" 2>/dev/null); then
              printf '  %-8s MISSING\n' "$tool"
              missing="$missing $tool"
            elif ! version=$(probe "$tool"); then
              printf '  %-8s %s (version probe failed)\n' "$tool" "$path"
              missing="$missing $tool"
            else
              printf '  %-8s %-30s %s\n' "$tool" "$version" "$path"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::ASIC tools missing or broken:$missing"
            echo "Place & Route, DRC and LVS cannot run. Check the OpenROAD .deb step"
            echo "and the Magic/Netgen build, then re-run: a cached /opt/asic-tools"
            echo "keeps a failed build from being noticed."
            exit 1
          fi
          echo "ASIC toolchain present"

      # ── Install SKY130 PDK ──────────────────────────────────
      - name: Cache SKY130 PDK
        id: cache-pdk
        uses: actions/cache@v4
        with:
          path: /opt/pdk
          key: sky130a-pdk-v1

      - name: Install SKY130 PDK
        if: steps.cache-pdk.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/pdk
          cd /tmp
          git clone --depth 1 https://github.com/google/skywater-pdk.git
          cd skywater-pdk
          make timing
          sudo cp -r libs.ref/sky130_fd_sc_hd /opt/pdk/sky130A/
          sudo cp -r libs.tech/magic /opt/pdk/sky130A/
          sudo cp -r libs.tech/openroad /opt/pdk/sky130A/
          sudo cp -r tech/magic /opt/pdk/sky130A/
          echo "PDK installed at /opt/pdk/sky130A"

      # ── Create build directory ───────────────────────────────
      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      # ── ASIC Synthesis (Yosys) ──────────────────────────────
      - name: ASIC Synthesis
        working-directory: c930/asic
        run: |
          echo "=== Starting Yosys synthesis ==="
          export PDK_ROOT=${{ env.PDK_ROOT }}
          yosys -s synth_yosys.ys 2>&1 | tee ${{ env.BUILD_DIR }}/synth.log
          echo "=== Synthesis complete ==="
          ls -la ${{ env.BUILD_DIR }}/c930_soc_synth.v

      # ── Gate count report ───────────────────────────────────
      - name: Gate count report
        working-directory: c930/asic
        run: |
          echo "=== Gate count estimation ==="
          python3 estimate_gates.py --sky130 2>&1 | tee ${{ env.BUILD_DIR }}/gate_count.txt || true

      # ── Physical Design (OpenROAD) ──────────────────────────
      - name: Physical Design (Place & Route)
        working-directory: c930/asic
        run: |
          echo "=== Starting OpenROAD P&R ==="
          export PDK_ROOT=${{ env.PDK_ROOT }}
          openroad -exit flow_openroad.tcl 2>&1 | tee ${{ env.BUILD_DIR }}/pnr.log
          echo "=== Physical design complete ==="
          ls -la ${{ env.BUILD_DIR }}/c930_soc_routed.gds

      # ── DRC (Magic) ─────────────────────────────────────────
      - name: Design Rule Check (DRC)
        working-directory: c930/asic
        run: |
          echo "=== Running DRC ==="
          export PDK_ROOT=${{ env.PDK_ROOT }}
          magic -noconsole -dnull \
            -c "tech read ${PDK_ROOT}/sky130_fd_sc_hd/sky130_fd_sc_hd.tech" \
            -c "gds read ${{ env.BUILD_DIR }}/c930_soc_routed.gds" \
            -c "drc list" \
            -c "drc catchall" \
            -c "quit" 2>&1 | tee ${{ env.BUILD_DIR }}/drc.log
          echo "=== DRC complete ==="
          # Check for DRC errors
          if grep -q "^DRC found 0 errors" ${{ env.BUILD_DIR }}/drc.log; then
            echo "✅ DRC PASSED — 0 errors"
          else
            echo "⚠️ DRC reported issues — check log"
            tail -20 ${{ env.BUILD_DIR }}/drc.log
          fi

      # ── LVS (Netgen) ────────────────────────────────────────
      - name: Layout vs. Schematic (LVS)
        working-directory: c930/asic
        run: |
          echo "=== Running LVS ==="
          export PDK_ROOT=${{ env.PDK_ROOT }}
          # Generate schematic netlist from synthesis output
          cp ${{ env.BUILD_DIR }}/c930_soc_synth.v ${{ env.BUILD_DIR }}/c930_soc_schematic.v
          # Run Netgen LVS
          netgen -batch \
            "compare_circuits {layout ${{ env.BUILD_DIR }}/c930_soc_routed.v} {schematic ${{ env.BUILD_DIR }}/c930_soc_schematic.v}" \
            -json ${{ env.BUILD_DIR }}/lvs_report.json \
            2>&1 | tee ${{ env.BUILD_DIR }}/lvs.log
          echo "=== LVS complete ==="
          # Check LVS result
          if grep -q "circuits match" ${{ env.BUILD_DIR }}/lvs.log; then
            echo "✅ LVS PASSED — netlists match"
          else
            echo "⚠️ LVS reported mismatches — check log"
            tail -20 ${{ env.BUILD_DIR }}/lvs.log
          fi

      # ── Timing report ───────────────────────────────────────
      - name: Timing summary
        working-directory: c930/asic
        run: |
          echo "=== Timing summary ==="
          if [ -f ${{ env.BUILD_DIR }}/c930_soc_routed.rpt ]; then
            head -50 ${{ env.BUILD_DIR }}/c930_soc_routed.rpt
          else
            echo "Timing report not found"
          fi

      # ── Area report ─────────────────────────────────────────
      - name: Area summary
        working-directory: c930/asic
        run: |
          echo "=== Area summary ==="
          if [ -f ${{ env.BUILD_DIR }}/c930_soc_routed.rpt ]; then
            grep -A5 "Design area" ${{ env.BUILD_DIR }}/c930_soc_routed.rpt || true
          fi

      # ── Generate DRC/LVS summary for PR comment ─────────────
      - name: Generate CI summary
        if: always()
        run: |
          SUMMARY="## GDS Build Summary\n\n"
          SUMMARY+="| Step | Status |\n|------|--------|\n"

          if [ -f ${{ env.BUILD_DIR }}/c930_soc_synth.v ]; then
            SUMMARY+="| Synthesis | ✅ Complete |\n"
          else
            SUMMARY+="| Synthesis | ❌ Failed |\n"
          fi

          if [ -f ${{ env.BUILD_DIR }}/c930_soc_routed.gds ]; then
            GDS_SIZE=$(du -h ${{ env.BUILD_DIR }}/c930_soc_routed.gds | cut -f1)
            SUMMARY+="| P&R | ✅ Complete ($GDS_SIZE) |\n"
          else
            SUMMARY+="| P&R | ❌ Failed |\n"
          fi

          if [ -f ${{ env.BUILD_DIR }}/drc.log ]; then
            if grep -q "DRC found 0 errors" ${{ env.BUILD_DIR }}/drc.log; then
              SUMMARY+="| DRC | ✅ Passed (0 errors) |\n"
            else
              DRC_ERRORS=$(grep "DRC found" ${{ env.BUILD_DIR }}/drc.log | tail -1)
              SUMMARY+="| DRC | ⚠️ Issues ($DRC_ERRORS) |\n"
            fi
          else
            SUMMARY+="| DRC | ❌ Not run |\n"
          fi

          if [ -f ${{ env.BUILD_DIR }}/lvs.log ]; then
            if grep -q "circuits match" ${{ env.BUILD_DIR }}/lvs.log; then
              SUMMARY+="| LVS | ✅ Passed |\n"
            else
              SUMMARY+="| LVS | ⚠️ Mismatches |\n"
            fi
          else
            SUMMARY+="| LVS | ❌ Not run |\n"
          fi

          echo -e "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      # ── Archive build artifacts ──────────────────────────────
      - name: Archive GDS
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grx930-sky130-gds
          path: |
            c930/asic/build/c930_soc_routed.gds
            c930/asic/build/c930_soc_routed.v
            c930/asic/build/c930_soc_routed.spef
          retention-days: 90

      - name: Archive build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grx930-build-logs
          path: |
            c930/asic/build/synth.log
            c930/asic/build/pnr.log
            c930/asic/build/drc.log
            c930/asic/build/lvs.log
            c930/asic/build/lvs_report.json
            c930/asic/build/gate_count.txt
          retention-days: 30

      # ── Fail the job if critical steps failed ────────────────
      - name: Final check
        if: always()
        run: |
          if [ ! -f ${{ env.BUILD_DIR }}/c930_soc_routed.gds ]; then
            echo "❌ GDS generation failed — no output file"
            exit 1
          fi
          echo "✅ GDS generation successful"
          echo "GDS file: ${{ env.BUILD_DIR }}/c930_soc_routed.gds"
          ls -lh ${{ env.BUILD_DIR }}/c930_soc_routed.gds
