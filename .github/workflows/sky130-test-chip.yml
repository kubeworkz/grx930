# sky130-test-chip.yml — harden the GRX930 test chip core on SKY130.
#
# Runs LibreLane's Classic flow (synthesis through signoff) on the tapeout RTL in
# c930/asic_gf180mcu/openlane2_rtl/src, with c930/asic_sky130_test_chip/config.json,
# in LibreLane's own image. LibreLane fetches the SKY130 PDK revision it pins
# (ciel), so the PDK and the tools move together when the image tag changes.
#
# The core is hardened on its own (no pad ring): the die size comes from the
# netlist at FP_CORE_UTIL, which is the number this job exists to measure. The
# area, timing and DRC/LVS results are printed to the log and the job summary,
# and the final GDS, netlist and reports are uploaded.
#
# Detailed routing takes longer than GitHub's hosted runners allow (6 hours), so
# the job runs on a self-hosted runner when the repository variable
# SKY130_RUNNER names one (its label, e.g. "sky130"). Pull requests from forks
# always stay on a hosted runner: this repository is public, and a self-hosted
# runner must not run code from outside it. Without the variable, every run is
# hosted, as before.

name: Sky130 test chip

on:
  push:
    branches: [main]
    paths:
      - 'c930/asic_sky130_test_chip/**'
      - 'c930/asic_gf180mcu/openlane2_rtl/src/**'
      - '.github/workflows/sky130-test-chip.yml'
  pull_request:
    paths:
      - 'c930/asic_sky130_test_chip/**'
      - 'c930/asic_gf180mcu/openlane2_rtl/src/**'
      - '.github/workflows/sky130-test-chip.yml'
  workflow_dispatch:

concurrency:
  group: sky130-test-chip-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBRELANE_IMAGE: ghcr.io/librelane/librelane:3.0.17
  DESIGN_DIR: c930/asic_sky130_test_chip
  RUN_TAG: ci

jobs:
  runner:
    name: Pick runner
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.pick.outputs.label }}
      timeout: ${{ steps.pick.outputs.timeout }}
    steps:
      - id: pick
        env:
          WANTED: ${{ vars.SKY130_RUNNER }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$WANTED" ] && [ "$FORK" != true ]; then
            echo "label=$WANTED" >> "$GITHUB_OUTPUT"
            echo "timeout=2880" >> "$GITHUB_OUTPUT"
            echo "Self-hosted runner: $WANTED (48 h limit)"
          else
            echo "label=ubuntu-24.04" >> "$GITHUB_OUTPUT"
            echo "timeout=350" >> "$GITHUB_OUTPUT"
            echo "Hosted runner (6 h limit)${WANTED:+: this pull request comes from a fork}"
          fi

  harden:
    name: Harden (sky130_fd_sc_hd)
    needs: runner
    runs-on: ${{ needs.runner.outputs.label }}
    timeout-minutes: ${{ fromJSON(needs.runner.outputs.timeout) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image and the PDK together need more than a hosted runner's free
      # space. Never on a self-hosted runner: that is someone's machine.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Pull LibreLane
        run: docker pull -q "$LIBRELANE_IMAGE"

      - name: Run the flow
        run: |
          mkdir -p "$HOME/.ciel"
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" -v "$HOME/.ciel:/pdk" \
            -w "/work/$DESIGN_DIR" "$LIBRELANE_IMAGE" \
            python3 -m librelane --pdk-root /pdk --pdk sky130A --scl sky130_fd_sc_hd \
              --flow classic \
              --run-tag "$RUN_TAG" -j "$(nproc)" config.json \
            2>&1 | tee flow.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Report
        if: always()
        run: |
          run="$DESIGN_DIR/runs/$RUN_TAG"
          m="$run/final/metrics.json"
          if [ -f "$m" ]; then
            {
              echo "## SKY130 test chip: $( [ "${status:-1}" = 0 ] && echo passed || echo "flow exited ${status:-?}")"
              echo
              echo "| metric | value |"
              echo "|---|---|"
              jq -r 'to_entries[] | select(.key | test("^(design__instance__(count|area)(__stdcell)?|design__die__(bbox|area)|design__core__(bbox|area)|design__instance__utilization|timing__setup__ws|timing__hold__ws|timing__setup__tns|clock__skew__worst_setup|route__drc_errors|route__wirelength|magic__drc_error__count|klayout__drc_error__count|design__lvs_error__count|antenna__violating__(nets|pins)|power__total|design__lint_(error|warning)__count)$")) | "| \(.key) | \(.value) |"' "$m"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "== all metrics (per-corner entries omitted)"
            jq -r 'to_entries[] | select(.key | contains("corner:") | not) | "\(.key) = \(.value)"' "$m"
          else
            echo "No final metrics: the flow stopped before signoff." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # The step that stopped the flow, and the end of its log.
          last=$(ls -d "$run"/*/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$last" ]; then
            echo "Last step: $last"
            for f in $(ls -t "$last"*.log 2>/dev/null | head -1); do echo "== $f"; tail -60 "$f"; done
          fi
          echo "== flow.log"; tail -80 flow.log || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky130-test-chip
          path: |
            ${{ env.DESIGN_DIR }}/runs/${{ env.RUN_TAG }}/final/
            ${{ env.DESIGN_DIR }}/runs/${{ env.RUN_TAG }}/*/*.log
            ${{ env.DESIGN_DIR }}/runs/${{ env.RUN_TAG }}/*/reports/
            flow.log
          if-no-files-found: warn

      # The flow runs as root in the container. A self-hosted runner keeps its
      # workspace, and the next checkout cannot clean root-owned files.
      - name: Return run files to the runner user
        if: always() && runner.environment == 'self-hosted'
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" "$LIBRELANE_IMAGE" \
            chown -R "$(id -u):$(id -g)" "/work/$DESIGN_DIR/runs" 2>/dev/null || true

      - name: Verdict
        run: exit "${status:-1}"
